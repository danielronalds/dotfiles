# Rebind splits (Inverted binds)
unbind '"'
unbind '%'
bind v split-window -h
bind - split-window -v

# Force naming of new windows (I'm lazy...)
unbind c
bind c command-prompt -p "Window name:" "new-window; rename-window %%"

# Replacing session switching with projman
unbind "s"
bind s popup -E "projman active -p tmux"

# Break current pane out into window
bind ! command-prompt -p "Window name:" "break-pane -t : \; rename-window '%%'"

# Join panes in a split
bind-key H choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

# Reload config
bind r source ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Launch applications in new window
bind -n C-y "new-window 'yazi'; rename-window 'Yazi'"
#bind -n C-g "new-window 'lazygit'; rename-window 'Lazygit'"
bind -n C-t popup -h 75% -w 75% -E "$SHELL"

bind -n C-p popup -E "projman -p tmux"
bind -n C-s popup -E "projman active -p tmux"

# Apply coding layout: 80-column main pane with vertical split
bind L run-shell 'if [ $(tmux list-panes | wc -l) -eq 1 ]; then tmux split-window -h; fi && tmux set-window-option main-pane-width 80 && tmux select-layout main-vertical'

# Apply triple-pane coding layout: 80 | rest | 80
bind T run-shell 'panes=$(tmux list-panes | wc -l); if [ $panes -eq 1 ]; then tmux split-window -h; tmux split-window -h; elif [ $panes -eq 2 ]; then tmux split-window -h; fi; tmux select-layout even-horizontal; tmux resize-pane -t 1 -x 80; tmux resize-pane -t 3 -x 80'

# Swap the two outer panes of the triple-pane layout
bind S swap-pane -s 1 -t 3

# Quick pane switching
bind h select-pane -t 1
bind j select-pane -t 2
bind l select-pane -t 3


bind N popup -h 75% -w 75% -E ",notes"

unbind n
bind n popup -h 75% -w 75% -E "projman notes"

bind g run-shell 'if [ "$(tmux show-option -gqv @show_short_status_left)" = "0" ]; then tmux set -g @show_short_status_left 1; else tmux set -g @show_short_status_left 0; fi; tmux refresh-client -S'

bind e run-shell 'if [ "$(tmux show-option -gqv @show_next_event_short)" = "0" ]; then tmux set -g @show_next_event_short 1; else tmux set -g @show_next_event_short 0; fi; tmux refresh-client -S'

bind W new-window -n "Calendar" "tput civis; $HOME/.config/tmux/scripts/week_events.sh; read -n 1 -s; tput cnorm"

bind C-t command-prompt -p "Timer:" "run-shell '$HOME/.config/tmux/scripts/timer.sh set \"%%\"'"

bind q kill-pane
bind Q kill-session

# :snake launches tui-snake in a popup sized to its 32x32 grid (cells are 2 chars wide)
set -s command-alias[100] 'snake=display-popup -w 66 -h 34 -x "#{e|-:#{client_width},66}" -y "#{client_height}" -E "$HOME/Personal/tui-snake/target/release/tui-snake; read -n 1 -s -p \"Press any key to close...\""'

# Click session name in status-right to switch sessions
bind-key -T root MouseDown1StatusLeft display-popup -E 'projman active -p tmux'
