set-option -g status-position top

set-option -g status-bg "#363a4f"
set-option -g status-fg "#cad3f5"

set -g status-left ""
set-option -g status-left-length 0

set -g window-status-format '#[fg=#b7bdf8]#[bg=#b7bdf8,fg=#{status-bg}]#I #[fg=#{status-fg},bg=#494d64] #W #[fg=#494d64,bg=#{status-bg}]#[default]'
set -g window-status-current-format '#[fg=#8aadf4]#[bg=#8aadf4,fg=#{status-bg}]#I #[fg=#{status-fg},bg=#494d64] #W #[fg=#494d64,bg=#{status-bg}]#[default]'

set -g status-right "\#{?window_zoomed_flag,,} #[fg=#{?client_prefix,#e78284,#cad3f5}]#[fg=#363a4f]#[bg=#{?client_prefix,#e78284,#cad3f5}] #S "
