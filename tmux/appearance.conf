set-option -g status-position top

set-option -g status-bg "#363a4f"
set-option -g status-fg "#cad3f5"

set -g status-left ""
set-option -g status-left-length 0

set @active_window_color "#cad3f5"
set @inactive_window_color "#939ab7"

set -g window-status-format '#[fg=#{@inactive_window_color}]#[bg=#{@inactive_window_color},fg=#{status-bg}]#I #[fg=#{status-fg},bg=#494d64] #W #[fg=#494d64,bg=#{status-bg}]#[default]'
set -g window-status-current-format '#[fg=#{@active_window_color}]#[bg=#{@active_window_color},fg=#{status-bg}]#I #[fg=#{status-fg},bg=#494d64] #W #[fg=#494d64,bg=#{status-bg}]#[default]'

set @prefix_color "#ed8796"

set -g status-right "\#{?window_zoomed_flag,,} #[fg=#{?client_prefix,#{@prefix_color},#{status-fg}}]#[fg=#363a4f]#[bg=#{?client_prefix,#{@prefix_color},#{status-fg}}] #S "
