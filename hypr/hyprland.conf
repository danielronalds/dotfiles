########################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
########################################################################################


#
# Please note not all available settings / options are set here.
# For a full list, see the wiki (basic and advanced configuring)
#

misc {
    disable_hyprland_logo=true
    vfr=true
}

monitor=,preferred,auto,1

input {
    kb_file=
    kb_layout=
    kb_variant=
    kb_model=
    kb_options=
    kb_rules=

    follow_mouse=1
    kb_options = ctrl:nocaps

    touchpad {
        natural_scroll=yes
        tap-and-drag=yes
    }

    sensitivity=0.30 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in=5
    gaps_out=20
    border_size=2
    col.active_border=0xCC8CAAEE
    col.inactive_border=0x00000000

    layout=master # Setting master as the default
}

decoration {
    rounding=10
    blur {
        enabled = true
        passes=2
    }
}

animations {
    enabled=1

    bezier=easeOutQuart, 0.25, 1, 0.5, 1

    animation=windows,1,3.5,easeOutQuart
    animation=border,1,3.5,easeOutQuart
    animation=fade,1,5,easeOutQuart
    animation=workspaces,1,3.5,easeOutQuart
}

master {
    new_status=master
}

gestures {
    workspace_swipe=yes
}

# Application Binds
bind=SUPER,RETURN,exec,ghostty
bind=SUPER_SHIFT,RETURN,exec,firefox
bind=SUPER_SHIFT,F,exec,kitty yazi
bind=SUPER_SHIFT_CTRL,F,exec,nemo
bind=SUPER_SHIFT,B,exec,blueman-manager

#bind=SUPER,P,exec,wofi --show drun
#bind=SUPER_SHIFT,P,exec,wofi --show run
bind=SUPER,P,exec,wmenu-run -N 24283B -n C0CAF5 -S 414868 -s C0CAF5 -b -f "sans-serif monospace 12"
# System Binds
bind=SUPER_SHIFT,Q,killactive,
bind=SUPER_SHIFT,C,exit,

# Brightness keys
bind=,XF86MonBrightnessDown,exec,brightnessctl s 1%-
bind=,XF86MonBrightnessUp,exec,brightnessctl s +1%

# Sound keys
bind=,XF86AudioRaiseVolume,exec,pamixer -i 5
bind=,XF86AudioLowerVolume,exec,pamixer -d 5
bind=,XF86AudioMute,exec,pamixer -t

bind=SUPER,V,togglefloating,
bind=SUPER,F,fullscreen,0
bind=SUPER_SHIFT,N,layoutmsg,cyclenext

bind=SUPER,H,movefocus,l
bind=SUPER,L,movefocus,r
bind=SUPER,K,movefocus,u
bind=SUPER,J,movefocus,d

bind=SUPER SHIFT,H,movewindow,l
bind=SUPER SHIFT,L,movewindow,r
bind=SUPER SHIFT,K,movewindow,u
bind=SUPER SHIFT,J,movewindow,d

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

bind=SUPER_SHIFT,1,movetoworkspace,1
bind=SUPER_SHIFT,2,movetoworkspace,2
bind=SUPER_SHIFT,3,movetoworkspace,3
bind=SUPER_SHIFT,4,movetoworkspace,4
bind=SUPER_SHIFT,5,movetoworkspace,5
bind=SUPER_SHIFT,6,movetoworkspace,6
bind=SUPER_SHIFT,7,movetoworkspace,7
bind=SUPER_SHIFT,8,movetoworkspace,8
bind=SUPER_SHIFT,9,movetoworkspace,9
bind=SUPER_SHIFT,0,movetoworkspace,10

bind=SUPER,mouse_down,workspace,e+1
bind=SUPER,mouse_up,workspace,e-1

# Scratchpad
bind=SUPER_SHIFT,S,movetoworkspace,special
bind=SUPER,S,togglespecialworkspace,

# Enabling dragging
bindm=SUPER,mouse:272,movewindow
bindm=SUPER,mouse:273,resizewindow

exec-once=dunst &
exec-once=waybar &
exec-once=nm-applet &
exec-once=waypaper --restore
